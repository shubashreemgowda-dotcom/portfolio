<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="gridPat" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#93c5fd" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="450" fill="url(#avatarGrad)"/>
  <rect width="400" height="450" fill="url(#gridPat)"/>

  <!-- Subtle Blueprint Geometrics -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <circle cx="200" cy="180" r="85" fill="#ffffff" fill-opacity="0.7"/>

  <!-- Monogram & Professional Silhouette -->
  <g transform="translate(200, 180)">
    <!-- Shield / Foundation Emblem -->
    <path d="M-60 -50 L60 -50 L60 10 C60 50 0 75 0 75 C0 75 -60 50 -60 10 Z" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="0.95"/>
    <text x="0" y="14" font-family="'Outfit', sans-serif" font-size="42" font-weight="700" fill="#1e40af" text-anchor="middle" letter-spacing="1">SM</text>
  </g>

  <!-- Base banner text -->
  <rect x="50" y="340" width="300" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">SHUBHASHREE M</text>
  <text x="200" y="385" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Civil Engineering &bull; SVCE Bengaluru</text>
</svg>
